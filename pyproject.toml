[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "applyflow"
version = "0.2.0"
description = "CLI that searches public job boards, matches roles to your resume, and helps you apply."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Applyflow" }]
dependencies = [
  "typer>=0.12",
  "rich>=13.7",
  "httpx>=0.27",
  "pydantic>=2.7",
  "pypdf>=4.3",
  "python-docx>=1.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
dev = ["pytest>=8.0"]

[project.scripts]
applyflow = "applyflow.cli:app"

[project.gui-scripts]
applyflow-gui = "applyflow.gui:launch"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
